name: Publish Alfred CAD Lab
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
      - 'scripts/check_gallery.py'
      - 'scripts/check_fan_lab.py'
      - 'scripts/check_three_speed.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public gallery
        uses: actions/checkout@v4
      - name: Validate self-contained media and physics
        run: |
          python3 scripts/check_gallery.py
          python3 scripts/check_fan_lab.py
          python3 scripts/check_three_speed.py
          node --check web/three-speed.js
          node --check web/fan-lab.js
          node --check web/app.js
          node --check web/model-viewer.js
          node --check web/gearbox-viewer.js
          node --check web/gearbox-materials.js
          node --check web/fullscreen.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload lightweight gallery
        uses: actions/upload-pages-artifact@v4
        with:
          path: web
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
